name: ci

# Type-check, test and build every pull request. The test suite includes
# `src/data-freshness.test.ts`, which fails if `data/` is out of step with
# `data/hijri/overrides.json` (i.e. overrides edited without `npm run generate`).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
