name: generate

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/cities.json"
      - "data/hijri/overrides.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
  # Monthly heartbeat keeps scheduled workflows enabled (GitHub disables them
  # after 60 days of repository inactivity) and refreshes rolling data.
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev

      - name: Regenerate calendar and prayer data
        run: npx tsx src/cli.ts generate

      # `main` is protected, so the generator cannot push to it directly. Propose
      # the regenerated data as a pull request instead, like the watcher does.
      # The pull request auto-merges (see below) — no human merge step.
      - name: Open a pull request with the regenerated data
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewers: FileHQ
          branch: chore/regenerate-data
          title: "Regenerate Hijri calendar and prayer data"
          body: |
            Automated regeneration, triggered by a change on `main` or the
            monthly heartbeat.

            The diff is normally only `generated_at` timestamps. It carries real
            changes when a new Hijri year rolls into range or a confirmed month
            start is added.
          commit-message: |
            chore: regenerate Hijri calendar and prayer data

            Co-authored-by: CommandCodeBot <noreply@commandcode.ai>
          add-paths: |
            data
          delete-branch: true

      # Auto-merge: the regenerated data is verified by CI on the pull
      # request (the freshness test passes only when the data matches
      # overrides.json), and no status check is required on main, so the
      # pull request merges as soon as it is mergeable. Deploy then
      # publishes the new data to Pages.
      - name: Enable auto-merge on the pull request
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY"
